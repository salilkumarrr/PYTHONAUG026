<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="login">

            <h2>Lumina</h2>

            <h1>Welcome back!</h1>

            <p class="subtitle">
                Pick up where you left off, and keep things moving.
            </p>

            <input type="email" placeholder="salil@example.com">

            <div class="password">
                <input type="password" placeholder="********">
                <span>Show</span>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">Remember me</label>
                    <a href="#">Forgot password?</a>
            </div>

            <button class="login-btn">Log in →</button>

            <p class="or">or</p>

            <button class="google-btn">
                <span>G</span> Continue with Google
            </button>

            <p class="signup">
                Don't have an Account?
                <a href="#">Sign up</a>
            </p>
        </div>

        <div class="picture">
            <img src="https://play-lh.googleusercontent.com/XrnuUDdehLQGw8oWOP7XRvY93x3ffH_gWu1sNoW108cm2pTIShtqwtctaqmv4FQjEHfMcgo99-9CUqK6wH0pJjM" alt="John Cena">
        </div>

    </div>

</body>
</html>
