<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>
</head>
<body>
    <h1>Basic form design using HTML</h1>
    <form>
        <fieldset>
            <legend>Personal Details</legend>
            <label>First Name: <input type="text" name="first name" id="first-name" placeholder="Enter your first name"><br><br></label>
            <label>Last Name: <input type="text" name="last name" id="last-name" placeholder="Enter your last name"><br><br></label>
            <label>Gender: </label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female<br><br>
            <label>Email: <input type="email" name="email" id="email" placeholder="Enter your email"><br><br></label>
            <label>Date of Birth: <input type="date" name="dob" id="dob" placeholder="dd-mm-yyyy"><br><br></label>
            <label>Address: <br><br><textarea name="address" id="address" cols="30" rows="10" placeholder="Enter your address"></textarea><br><br></label>
     <input type="submit" value="Submit">
        </fieldset>



    </form>

</body>
</html>
